# Kiosk Goblin - Dashboard Configuration
title: "TERMINAL SYSTEM TELEMETRY"
refresh_interval: 2
theme: "matrix-dark"

# Choose datasource: 'mock' (dynamic) or 'json' (offline file-based)
datasource:
  type: "mock"

# Grid Layout. Maximum column width is 12.
layout:
  - row:
      - plugin: "datetime_weather"
        width: 12
  - row:
      - plugin: "ml_training"
        width: 12
  - row:
      - plugin: "dataset_status"
        width: 6
      - plugin: "system_metrics"
        width: 6
  - row:
      - plugin: "media_preview"
        width: 12
  - row:
      - plugin: "event_log"
        width: 12

# Specific Plugin Parameters (Monochrome green scale accents)
panels:
  datetime_weather:
    accent_color: "#00ff41"
  ml_training:
    chart_height: 220
    accent_color: "#00ff41"
  dataset_status:
    chart_height: 180
    accent_color: "#00cc33"
  system_metrics:
    accent_color: "#00ff41"
  media_preview:
    height: 300
    accent_color: "#00ff41"
  event_log:
    height: 150
    accent_color: "#008f11"
